<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAS Module — Coal Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #03080F;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 500px;
    padding: 3rem 1.5rem;
    text-align: center;
  }
  .wrap { max-width: 480px; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #3A8FF0;
    background: rgba(27,111,212,0.1);
    border: 1px solid rgba(27,111,212,0.2);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem; }
  p { color: rgba(255,255,255,0.5); font-size: 0.95rem; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Coming Soon</span>
    <h1>Coal &amp; Pet Coke IAS Simulation</h1>
    <p>The interactive coal-specific IAS walkthrough is being finalized. Check back shortly, or book a demo to see it live for your operation.</p>
  </div>
  <script>
    function reportHeight() {
      var h = document.body.scrollHeight;
      window.parent.postMessage({ iasHeight: h }, "*");
    }
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    setTimeout(reportHeight, 100);
  </script>
</body>
</html>
